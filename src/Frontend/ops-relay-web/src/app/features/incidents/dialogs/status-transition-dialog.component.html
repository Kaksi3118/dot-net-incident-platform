<h2 mat-dialog-title>Change incident status</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content class="space-y-4 pt-2">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>New status</mat-label>
      <mat-select formControlName="newStatus">
        <mat-option *ngFor="let status of data.allowedStatuses" [value]="status">
          {{ status }}
        </mat-option>
      </mat-select>
      <mat-error *ngIf="form.controls.newStatus.hasError('required')">
        Status is required.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Reason</mat-label>
      <textarea
        matInput
        formControlName="reason"
        rows="3"
        placeholder="Describe why the status is changing"
      ></textarea>
      <mat-hint>Minimum 5 characters.</mat-hint>
      <mat-error *ngIf="form.controls.reason.hasError('required')">
        Reason is required.
      </mat-error>
      <mat-error *ngIf="form.controls.reason.hasError('minlength')">
        Use at least 5 characters.
      </mat-error>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">
      Update status
    </button>
  </mat-dialog-actions>
</form>
