name: OpsRelay CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'migration/**', 'release/**' ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ─────────────────────────────────────────────
  # Backend: Build + Test + Coverage
  # ─────────────────────────────────────────────
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore OpsRelay.sln

      - name: Build
        run: dotnet build OpsRelay.sln --no-restore --configuration Release

      - name: Unit Tests
        run: |
          dotnet test tests/OpsRelay.UnitTests/OpsRelay.UnitTests.csproj \
            --no-build --configuration Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Integration Tests
        run: |
          dotnet test tests/OpsRelay.IntegrationTests/OpsRelay.IntegrationTests.csproj \
            --no-build --configuration Release
        env:
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/**/coverage.cobertura.xml
          fail_ci_if_error: false

  # ─────────────────────────────────────────────
  # Frontend: Build + Test
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend (Angular 17)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Frontend/ops-relay-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: src/Frontend/ops-relay-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx ng lint --max-warnings 0

      - name: Build (production)
        run: npx ng build --configuration production

      - name: Unit Tests
        run: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage

  # ─────────────────────────────────────────────
  # Docker: Build verification
  # ─────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: opsrelay:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
